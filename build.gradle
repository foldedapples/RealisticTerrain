// ---------------------------------------------------------------------------
// Model asset manifest generation
// ---------------------------------------------------------------------------
tasks.register('generateModelAssetManifest') {
    inputs.property('modelRepositorySlug', modelRepositorySlug)
    inputs.property('modelRepositoryRevision', modelRepositoryRevision)
    outputs.file(generatedManifestFile)

    doLast {
        generatedManifestDirectory.mkdirs()

        String apiUrl = "https://huggingface.co/api/models/${modelRepositorySlug}/revision/${modelRepositoryRevision}?blobs=true"
        Map modelInfo = new JsonSlurper().parseText(new URL(apiUrl).getText('UTF-8')) as Map
        List siblings = modelInfo.siblings as List

        List<String> requiredFiles = [
                'base_model.onnx',
                'coarse_model.onnx',
                'decoder_model.onnx',
                'pipeline_data.json',
                'world_pipeline_config.json'
        ]

        Map<String, Object> assetEntries = [:]
        for (String requiredFileName : requiredFiles) {
            Map siblingEntry = siblings.find { it.rfilename == requiredFileName } as Map
            if (siblingEntry == null) {
                throw new GradleException("Required model asset missing from HF commit ${modelRepositoryRevision}: ${requiredFileName}")
            }

            String resolveUrl = "https://huggingface.co/${modelRepositorySlug}/resolve/${modelRepositoryRevision}/${requiredFileName}?download=true"
            long expectedSizeBytes = ((Number) siblingEntry.size).longValue()
            String expectedSha256
            if (siblingEntry.lfs instanceof Map && siblingEntry.lfs.sha256 != null) {
                expectedSha256 = siblingEntry.lfs.sha256 as String
            } else {
                byte[] remoteFileBytes = new URL(resolveUrl).bytes
                expectedSha256 = sha256Hex(remoteFileBytes)
            }

            assetEntries[requiredFileName] = [
                    sha256: expectedSha256,
                    sizeBytes: expectedSizeBytes,
                    url: resolveUrl
            ]
        }

        Map<String, Object> manifestPayload = [
                repositorySlug: modelRepositorySlug,
                revision: modelRepositoryRevision,
                assets: assetEntries
        ]
        generatedManifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifestPayload))
    }
}

// ---------------------------------------------------------------------------
// DirectML runtime assembly (Windows)
//
// Maven Central publishes only `onnxruntime` (CPU) and `onnxruntime_gpu` (CUDA). DirectML ships as a
// NuGet native runtime, and the reference integration (xandergos/terrain-diffusion-mc) expects a
// locally built `libs/onnxruntime-dml.jar`. This task reproduces that jar from the version-matched
// Maven Central Java bindings plus the pinned, SHA-256-verified DirectML native `onnxruntime.dll`,
// so `-PuseDml=true` no longer fails on an unresolvable `onnxruntime-dml:1.0` coordinate.
// ---------------------------------------------------------------------------
def prepareDirectMlRuntime = tasks.register('prepareDirectMlRuntime') {
    group = 'build setup'
    description = 'Assembles libs/onnxruntime-dml.jar (Maven ONNX Runtime Java bindings + pinned DirectML native runtime).'
    def outFile = file("libs/onnxruntime-dml-${onnxRuntimeVersion}.jar")
    outputs.file(outFile)
    inputs.property('onnxRuntimeVersion', onnxRuntimeVersion)
    inputs.property('directMlNupkgSha256', directMlNupkgSha256)
    inputs.property('directMlNupkgUrl', directMlNupkgUrl)

    doLast {
        file('libs').mkdirs()
        // Cache the download outside build/ so a `clean` does not force a fresh 15 MB fetch.
        def cacheDir = new File(gradle.gradleUserHomeDir, 'realisticterrain/directml')
        cacheDir.mkdirs()
        def work = new File(temporaryDir, 'directml')
        work.mkdirs()

        // 1. Download and verify the pinned DirectML NuGet package.
        def nupkg = new File(cacheDir, 'onnxruntime-directml.nupkg')
        if (!nupkg.exists() || sha256Hex(nupkg.bytes) != directMlNupkgSha256) {
            logger.lifecycle("Downloading DirectML runtime (${onnxRuntimeVersion}) from ${directMlNupkgUrl}")
            nupkg.delete()
            new URL(directMlNupkgUrl).withInputStream { input ->
                nupkg.withOutputStream { out -> out << input }
            }
        }
        def actualSha = sha256Hex(nupkg.bytes)
        if (actualSha != directMlNupkgSha256) {
            throw new GradleException("DirectML package SHA-256 mismatch: expected ${directMlNupkgSha256} but got ${actualSha}")
        }

        // 2. Read the win-x64 DirectML native onnxruntime.dll out of the nupkg.
        def dmlDllBytes
        def zip = new java.util.zip.ZipFile(nupkg)
        try {
            def entry = zip.getEntry('runtimes/win-x64/native/onnxruntime.dll')
            if (entry == null) {
                throw new GradleException('runtimes/win-x64/native/onnxruntime.dll not found in the DirectML package')
            }
            dmlDllBytes = zip.getInputStream(entry).bytes
        } finally {
            zip.close()
        }

        // 3. Resolve the Maven Central Java bindings jar and pick the native slot to replace.
        def baseJar = configurations.onnxRuntimeBase.singleFile
        def nativeRoot = 'ai/onnxruntime/native/'
        def winPrefix = nativeRoot + 'win-x64/'
        def nativePath = winPrefix + 'onnxruntime.dll'
        def jniPath = winPrefix + 'onnxruntime4j_jni.dll'

        // 4. Copy the base jar, keeping only what the DirectML Windows backend needs:
        //    - the Java classes,
        //    - the version-matched, backend-agnostic JNI bridge (onnxruntime4j_jni.dll),
        //    - the DirectML onnxruntime.dll substituted in place of the CPU build.
        //    Everything else is dropped: other platforms' binaries are unusable from a DirectML build,
        //    and the 300 MB of .pdb debug symbols are not loaded at runtime. Shipping them would put
        //    an incompatible CPU onnxruntime.dll next to the DirectML one in the same jar.
        def sawJni = false
        def tmpOut = new File(work, 'onnxruntime-dml.jar')
        tmpOut.delete()
        def out = new java.util.zip.ZipOutputStream(new BufferedOutputStream(tmpOut.newOutputStream()))
        try {
            def source = new java.util.zip.ZipFile(baseJar)
            try {
                def entries = source.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    def name = entry.getName()
                    if (entry.isDirectory()) {
                        continue
                    }
                    if (name.startsWith(nativeRoot)) {
                        if (!name.startsWith(winPrefix) || name.endsWith('.pdb') || name == nativePath) {
                            continue
                        }
                        if (name == jniPath) {
                            sawJni = true
                        }
                    }
                    def newEntry = new java.util.zip.ZipEntry(name)
                    newEntry.time = entry.time
                    out.putNextEntry(newEntry)
                    out.write(source.getInputStream(entry).bytes)
                    out.closeEntry()
                }
            } finally {
                source.close()
            }
            if (!sawJni) {
                throw new GradleException("${jniPath} not found in ${baseJar.name}; the DirectML jar would have no JNI bridge")
            }
            def dmlEntry = new java.util.zip.ZipEntry(nativePath)
            out.putNextEntry(dmlEntry)
            out.write(dmlDllBytes)
            out.closeEntry()
        } finally {
            out.close()
        }
        outFile.delete()
        java.nio.file.Files.move(tmpOut.toPath(), outFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Wrote ${outFile} (${outFile.length()} bytes)")
    }
}

if (useDml) {
    tasks.named('processIncludeJars') { dependsOn prepareDirectMlRuntime }
    tasks.named('jar') { dependsOn prepareDirectMlRuntime }
}

// ---------------------------------------------------------------------------
// Build variant tasks
//
// These must delegate to a *separate* Gradle invocation, because Gradle cannot change the values of
// `useCuda` / `useDml` / `useCpu` within a running build - the dependencies, the artifact version and
// the `include` configuration are all decided at configuration time.
//
// Note the extra '--no-daemon' and the '-x test': a nested build inherits the outer build's project
// lock, so the inner build must not try to fork its own daemon or run the test task. Without those,
// `gradlew buildDml` reaches `:test` and then waits forever on a lock the outside build is still
// holding. Tests still run for `gradlew test build -PuseDml=true`, which is the documented path.
// ---------------------------------------------------------------------------
def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
def gradlewExecutable = rootProject.file(isWindows ? 'gradlew.bat' : 'gradlew').absolutePath

['Cuda', 'Dml', 'Cpu'].each { variant ->
    tasks.register("build${variant}", Exec) {
        group = 'build'
        description = "Builds the ${variant.toLowerCase()} variant in a nested Gradle invocation."
        workingDir rootProject.projectDir
        commandLine gradlewExecutable, 'build', '-x', 'test', '--no-daemon',
                "--console=plain", "-Puse${variant}=true"
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds the CUDA, DirectML and CPU variants.'
    dependsOn 'buildCuda', 'buildDml', 'buildCpu'
}

String sha256Hex(byte[] fileBytes) {
    MessageDigest messageDigest = MessageDigest.getInstance('SHA-256')
    byte[] digestBytes = messageDigest.digest(fileBytes)
    StringBuilder hexBuilder = new StringBuilder(digestBytes.length * 2)
    for (byte digestByte : digestBytes) {
        hexBuilder.append(String.format('%02x', digestByte))
    }
    return hexBuilder.toString()
}
// `contributors` written as an object instead of an array), and that failure
// only surfaces at game launch. These checks are wired into `check`, so a
// plain `gradlew build` fails fast with a readable message instead.
// ---------------------------------------------------------------------------
def validateModMetadata = tasks.register('validateModMetadata') {
    group = 'verification'
    description = 'Validates fabric.mod.json and the other resource JSON files.'

    def mainResources = file('src/main/resources')
    def clientResources = file('src/client/resources')
    inputs.files(mainResources, clientResources).withPropertyName('resources')

    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def problems = []
        def peopleKeys = ['authors', 'contributors']
        def dependencyKeys = ['depends', 'recommends', 'suggests', 'breaks', 'conflicts']

        // 1. Every resource JSON file must at least be parseable.
        [mainResources, clientResources].each { dir ->
            if (!dir.exists()) {
                return
            }
            dir.eachFileRecurse { f ->
                if (!f.isFile() || !f.name.endsWith('.json')) {
                    return
                }
                try {
                    slurper.parse(f)
                } catch (Exception e) {
                    problems << "${f}: invalid JSON - ${e.message}"
                }
            }
        }

        // 2. fabric.mod.json must satisfy the parts of the Fabric spec that
        //    break mod loading when violated.
        def metadata = new File(mainResources, 'fabric.mod.json')
        if (!metadata.exists()) {
            problems << 'src/main/resources/fabric.mod.json is missing'
        } else {
            def json = null
            try {
                json = slurper.parse(metadata)
            } catch (Exception e) {
                problems << "fabric.mod.json is not valid JSON - ${e.message}"
            }

            if (json instanceof Map) {
                ['schemaVersion', 'id', 'version', 'name'].each { key ->
                    if (json[key] == null) {
                        problems << "fabric.mod.json: missing required key '${key}'"
                    }
                }

                // Fabric logs "Unsupported root entry" warnings for anything outside its schema
                // (e.g. a stray "credits" field). Fail here instead so the launch log stays clean.
                def allowedRootKeys = [
                        'schemaVersion', 'id', 'version', 'name', 'description', 'authors',
                        'contributors', 'contact', 'license', 'icon', 'environment', 'entrypoints',
                        'mixins', 'accessWidener', 'jars', 'languageAdapters', 'depends',
                        'recommends', 'suggests', 'conflicts', 'breaks', 'provides', 'custom'
                ] as Set
                json.keySet().each { key ->
                    if (!allowedRootKeys.contains(key)) {
                        problems << "fabric.mod.json: unsupported root entry '${key}' (Fabric rejects/warns on unknown keys)"
                    }
                }

                peopleKeys.each { key ->
                    if (!json.containsKey(key)) {
                        return
                    }
                    if (!(json[key] instanceof List)) {
                        problems << "fabric.mod.json: '${key}' must be an array (Fabric rejects objects and bare strings)"
                        return
                    }
                    json[key].eachWithIndex { entry, i ->
                        if (entry instanceof String) {
                            return
                        }
                        if (entry instanceof Map && entry['name'] != null) {
                            return
                        }
                        problems << "fabric.mod.json: '${key}[${i}]' must be a string or an object with a 'name'"
                    }
                }

                dependencyKeys.each { key ->
                    if (!json.containsKey(key)) {
                        return
                    }
                    if (!(json[key] instanceof Map)) {
                        problems << "fabric.mod.json: '${key}' must be an object"
                        return
                    }
                    json[key].each { modId, value ->
                        if (!(value instanceof String) && !(value instanceof List)) {
                            problems << "fabric.mod.json: '${key}.${modId}' must be a string or an array of strings"
                        }
                    }
                }

                if (json['entrypoints'] != null) {
                    if (!(json['entrypoints'] instanceof Map)) {
                        problems << "fabric.mod.json: 'entrypoints' must be an object"
                    } else {
                        json['entrypoints'].each { name, value ->
                            if (!(value instanceof List)) {
                                problems << "fabric.mod.json: 'entrypoints.${name}' must be an array"
                            }
                        }
                    }
                }

                (json['mixins'] ?: []).eachWithIndex { mixin, i ->
                    def configName = (mixin instanceof Map) ? mixin['config'] : mixin
                    if (configName == null) {
                        problems << "fabric.mod.json: 'mixins[${i}]' is missing a 'config' entry"
                        return
                    }
                    def found = [new File(mainResources, configName), new File(clientResources, configName)].any { it.exists() }
                    if (!found) {
                        problems << "fabric.mod.json: mixin config '${configName}' was not found in src/main/resources or src/client/resources"
                    }
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException('Metadata validation failed:\n  - ' + problems.join('\n  - '))
        }
        logger.lifecycle('validateModMetadata: fabric.mod.json and resource JSON files are valid.')
    }
}

tasks.named('check') {
    dependsOn validateModMetadata
}
