plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

def useCuda = project.hasProperty('useCuda') && project.property('useCuda').toString().toLowerCase() == 'true'
def useDml = project.hasProperty('useDml') && project.property('useDml').toString().toLowerCase() == 'true'
def useCpu = project.hasProperty('useCpu') && project.property('useCpu').toString().toLowerCase() == 'true'
def useAi = useCuda || useDml || useCpu

println "Build variant: ${useCuda ? 'CUDA' : useDml ? 'DirectML (Windows)' : useCpu ? 'CPU' : 'No AI (Geological only)'}"

def onnxRuntimeVersion = '1.20.0'
// Microsoft DirectML is *not* published to Maven Central (only `onnxruntime` and `onnxruntime_gpu`
// are). The reference integration (xandergos/terrain-diffusion-mc) ships a locally built
// libs/onnxruntime-dml.jar. We reproduce that jar here from the version-matched Maven Central Java
// bindings plus the pinned NuGet DirectML native runtime, so `-PuseDml=true` builds without requiring
// a Visual Studio / Windows SDK toolchain while still keeping the DirectML native library separate
// from the CUDA and CPU builds.
def directMlNugetVersion = onnxRuntimeVersion
def directMlNupkgSha256 = 'e9e341daf6157f5e89413d9ad457e576b80832788916863c6427566c45f0dec9'
def directMlNupkgUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/${directMlNugetVersion}/microsoft.ml.onnxruntime.directml.${directMlNugetVersion}.nupkg"

def modelRepositorySlug = 'xandergos/terrain-diffusion-30m-onnx'
def modelRepositoryRevision = 'ad2df557eca5645f588766101cf3bc3682455c3e'
def generatedManifestDirectory = layout.buildDirectory.dir('generated/model-assets').get().asFile
def generatedManifestFile = new File(generatedManifestDirectory, 'model-assets-manifest.json')

// Self-describing artifact names: realistic-terrain-<mod_version>-<variant>.jar
def buildVariant = useCuda ? 'cuda' : useDml ? 'dml' : useCpu ? 'cpu-ai' : 'geo'
version = "${project.mod_version}-${buildVariant}"
group = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()

    mods {
        realisticterrain {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

// Base Maven Central ONNX Runtime Java bindings, used only to assemble the DirectML jar.
configurations {
    onnxRuntimeBase
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    if (useCuda) {
        implementation "com.microsoft.onnxruntime:onnxruntime_gpu:${onnxRuntimeVersion}"
        include "com.microsoft.onnxruntime:onnxruntime_gpu:${onnxRuntimeVersion}"
    } else if (useCpu) {
        implementation "com.microsoft.onnxruntime:onnxruntime:${onnxRuntimeVersion}"
        include "com.microsoft.onnxruntime:onnxruntime:${onnxRuntimeVersion}"
    } else if (useDml) {
        // Assembled by prepareDirectMlRuntime into libs/ and nested via Loom's `include`. It is
        // deliberately *not* on the compile classpath: the Java source only reaches ONNX through
        // reflection (see OnnxModel), and putting it there makes every compile task consume
        // prepareDirectMlRuntime's output, which Gradle rejects as an implicit dependency. It is
        // declared as a normal module rather than a raw file so Loom can nest it - a bare file has
        // no artifact capabilities.
        include "com.microsoft.onnxruntime:onnxruntime-dml:${onnxRuntimeVersion}"
    }

    // Only used to build the DirectML jar in prepareDirectMlRuntime; never on the compile classpath.
    onnxRuntimeBase "com.microsoft.onnxruntime:onnxruntime:${onnxRuntimeVersion}"

    implementation 'com.google.code.gson:gson:2.11.0'
    include 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    // build-variant.properties identifies the shipped backend at runtime (geo/dml/cuda/cpu-ai).
    filesMatching("build-variant.properties") { expand "build_variant": buildVariant }
    if (useAi) {
        dependsOn 'generateModelAssetManifest'
        from(generatedManifestFile) { into '' }
    }
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
    maxHeapSize = '2g'
    // `-Drealisticterrain.diagnostics=true` on the Gradle command line lands on the Gradle daemon,
    // not on the forked test JVM, so the documented `./gradlew test --tests '*TerrainDiagnostics*'
    // -Drealisticterrain.diagnostics=true` command silently skipped the very test it named.
    // Forward the properties the tests read into the forked JVM explicitly.
    ['realisticterrain.diagnostics'].each { key ->
        systemProperty key, System.getProperty(key, 'false')
    }
}

